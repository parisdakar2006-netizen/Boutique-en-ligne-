<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma Marketplace</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin-bottom: 12px;
    }

    .search {
      width: 90%;
      max-width: 600px;
      padding: 13px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .sell {
      background: #16a34a;
      color: white;
    }

    .buy {
      background: #2563eb;
      color: white;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .title {
      text-align: center;
      margin-bottom: 25px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
    }

    .product h3 {
      margin: 12px 0 8px;
    }

    .price {
      color: #16a34a;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    footer {
      margin-top: 40px;
      padding: 25px;
      text-align: center;
      background: #111;
      color: white;
    }
  </style>
</head>

<body>

<header>
  <h1>🛍️ Ma Marketplace</h1>
  <input
    class="search"
    type="search"
    placeholder="Rechercher un produit..."
    onkeyup="searchProducts()"
    id="search"
  >
</header>

<div class="buttons">
  <button class="buy" onclick="alert('Bienvenue dans la marketplace !')">
    🛒 Acheter
  </button>

  <button class="sell" onclick="alert('La fonction vendre sera ajoutée prochainement.')">
    ➕ Vendre un produit
  </button>
</div>

<main>

  <h2 class="title">Produits disponibles</h2>

  <div class="products" id="products">

    <div class="product">
      <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=600&q=80">
      <h3>T-shirt</h3>
      <p class="price">5 000 FCFA</p>
      <button class="buy" onclick="buyProduct('T-shirt')">
        Acheter
      </button>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80">
      <h3>Chaussures</h3>
      <p class="price">15 000 FCFA</p>
      <button class="buy" onclick="buyProduct('Chaussures')">
        Acheter
      </button>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80">
      <h3>Montre</h3>
      <p class="price">10 000 FCFA</p>
      <button class="buy" onclick="buyProduct('Montre')">
        Acheter
      </button>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80">
      <h3>Casque audio</h3>
      <p class="price">12 000 FCFA</p>
      <button class="buy" onclick="buyProduct('Casque audio')">
        Acheter
      </button>
    </div>

  </div>

</main>

<footer>
  <p>© 2026 Ma Marketplace</p>
  <p>Achetez et vendez facilement en ligne.</p>
</footer>

<script>
  function buyProduct(product) {
    alert("Vous avez choisi : " + product);
  }

  function searchProducts() {
    let search = document.getElementById("search").value.toLowerCase();
    let products = document.querySelectorAll(".product");

    products.forEach(function(product) {
      let name = product.querySelector("h3").textContent.toLowerCase();

      if (name.includes(search)) {
        product.style.display = "block";
      } else {
        product.style.display = "none";
      }
    });
  }
</script>

</body>
</html>
